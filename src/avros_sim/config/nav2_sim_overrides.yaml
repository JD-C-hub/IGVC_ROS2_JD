# Sim-specific Nav2 parameter overrides for Webots simulation.
#
# Webots does not ship the hardware-only spatio_temporal_voxel_layer plugin,
# so use Nav2's built-in VoxelLayer here. The hardware configuration remains
# unchanged and continues to use STVL.

controller_server:
  ros__parameters:
    progress_checker:
      required_movement_radius: 0.1
      movement_time_allowance: 120.0    # sim runs slower than real time
    FollowPath:
      desired_linear_vel: 1.0           # slower for sim stability
      use_collision_detection: false    # VelodynePuck sees ground as obstacles
 
local_costmap:
  local_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: velodyne_points
        velodyne_points:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_min_range: 1.0
          obstacle_max_range: 15.0
          raytrace_min_range: 1.0
          raytrace_max_range: 20.0

      width: 100
      height: 100
      resolution: 0.5

global_costmap:
  global_costmap:
    ros__parameters:
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: velodyne_points
        velodyne_points:
          topic: /velodyne_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_min_range: 1.0
          obstacle_max_range: 30.0
          raytrace_min_range: 1.0
          raytrace_max_range: 35.0
